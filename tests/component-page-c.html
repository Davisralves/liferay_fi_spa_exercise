<!DOCTYPE html>
<html lang="en">

<head>
    <title>Barber Shop - Checkout</title>
    <script src="../scripts/spaReady.js"></script>
    <script src="../scripts/spaEngine.js" defer></script>
    <script src="../scripts/spaInit.js" defer></script>
</head>

<body>
    <h1>Confirm your appointment</h1>

    <section id="barber-selection" data-spa-component>
        <h2>Barber</h2>

        <label>
            <input id="barber-ana" name="barber" type="radio" value="ana" disabled>
            Ana
        </label>

        <label>
            <input id="barber-bruno" name="barber" type="radio" value="bruno" disabled>
            Bruno
        </label>

        <label>
            <input id="barber-carla" name="barber" type="radio" value="carla" disabled>
            Carla
        </label>
    </section>

    <section id="service-selection" data-spa-component>
        <h2>Services</h2>

        <label>
            <input id="service-haircut" name="services" type="checkbox" value="haircut" disabled>
            Haircut
        </label>

        <label>
            <input id="service-shave" name="services" type="checkbox" value="shave" disabled>
            Shave
        </label>

        <label>
            <input id="service-beard-trim" name="services" type="checkbox" value="beard-trim" disabled>
            Beard trim
        </label>

        <label>
            <input id="service-styling" name="services" type="checkbox" value="styling" disabled>
            Styling
        </label>

        <fieldset>
            <legend>Appointment time</legend>

            <label>
                <input id="appointment-morning" name="appointment-time" type="radio" value="morning" disabled>
                Morning
            </label>

            <label>
                <input id="appointment-afternoon" name="appointment-time" type="radio" value="afternoon" disabled>
                Afternoon
            </label>
        </fieldset>

        <p id="service-summary">0 services selected</p>
        <p id="appointment-summary">No appointment time selected</p>
    </section>

    <button id="confirm-booking" type="button">Confirm appointment</button>
    <p id="booking-confirmation" hidden>Appointment scheduled successfully.</p>

    <button id="back-to-services" type="button">Back to services</button>

    <script>
        runAfterPageRendered(() => {
            const backButton = document.querySelector('#back-to-services');
            const confirmationButton = document.querySelector('#confirm-booking');
            const confirmationMessage = document.querySelector('#booking-confirmation');

            backButton.addEventListener('click', () => {
                window.spaEngine.navigate('../tests/component-page-b.html');
            });

            confirmationButton.addEventListener('click', () => {
                confirmationMessage.hidden = false;
            });

            window.spaEngine.registerComponent('service-selection', {
                save(component) {
                    return {
                        selectedServiceCount: component.querySelectorAll(
                            'input[name="services"]:checked',
                        ).length,
                        appointmentTime: component.querySelector(
                            'input[name="appointment-time"]:checked',
                        )?.value ?? null,
                    };
                },

                restore(component, state) {
                    component.querySelector('#service-summary').textContent =
                        `${state.selectedServiceCount} services selected`;
                    component.querySelector('#appointment-summary').textContent =
                        state.appointmentTime
                            ? `Appointment: ${state.appointmentTime}`
                            : 'No appointment time selected';
                },
            });
        });
    </script>
</body>

</html>
