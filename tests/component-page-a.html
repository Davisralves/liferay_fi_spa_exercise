<!DOCTYPE html>
<html lang="en">

<head>
    <title>Barber Shop - Choose a Barber</title>
    <script src="../scripts/spaReady.js"></script>
    <script src="../scripts/spaEngine.js" defer></script>
    <script src="../scripts/spaInit.js" defer></script>
</head>

<body>
    <h1>Barber Shop</h1>

    <section data-spa-component id="booking-controls">
        <label>
            Search by name
            <input id="booking-search-a" type="search">
        </label>

        <label>
            <input id="booking-order" type="checkbox" checked>
            Ascending order
        </label>
    </section>

    <section id="barber-selection" data-spa-component>
        <h2>Choose your barber</h2>

        <label data-filter-item data-name="Ana">
            <input id="barber-ana" name="barber" type="radio" value="ana">
            Ana
        </label>

        <label data-filter-item data-name="Bruno">
            <input id="barber-bruno" name="barber" type="radio" value="bruno">
            Bruno
        </label>

        <label data-filter-item data-name="Carla">
            <input id="barber-carla" name="barber" type="radio" value="carla">
            Carla
        </label>
    </section>

    <a href="component-page-b.html">Choose services</a>

    <script>
        runAfterPageRendered(() => {
            const search = document.querySelector('#booking-search-a');
            const order = document.querySelector('#booking-order');
            const list = document.querySelector('#barber-selection');
            const items = [...list.querySelectorAll('[data-filter-item]')];

            function updateList() {
                const query = search.value.trim().toLowerCase();

                items
                    .sort((firstItem, secondItem) => {
                        const firstName = firstItem.dataset.name;
                        const secondName = secondItem.dataset.name;

                        return order.checked
                            ? firstName.localeCompare(secondName)
                            : secondName.localeCompare(firstName);
                    })
                    .forEach((item) => {
                        item.hidden = !item.dataset.name.toLowerCase().includes(query);
                        list.append(item);
                    });
            }

            search.addEventListener('input', updateList);
            order.addEventListener('change', updateList);
            updateList();
        });
    </script>
</body>

</html>
